<!DOCTYPE html>
<html>

<head>

    <title>Health Tips</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-red-50 min-h-screen">

    <div class="max-w-4xl mx-auto p-10">

        <h1 class="text-4xl font-bold text-red-700 mb-8">

            Health Tips After Blood Donation

        </h1>

        <div class="bg-white p-6 rounded-xl shadow mb-4">

            <h2 class="font-bold text-xl">
                Drink More Water
            </h2>

            <p>
                Donate করার পরে বেশি পানি পান করুন।
            </p>

        </div>

        <div class="bg-white p-6 rounded-xl shadow mb-4">

            <h2 class="font-bold text-xl">
                Eat Iron Rich Food
            </h2>

            <p>
                পালং শাক, কলিজা, ডিম, মাছ খান।
            </p>

        </div>

        <div class="bg-white p-6 rounded-xl shadow mb-4">

            <h2 class="font-bold text-xl">
                Rest Properly
            </h2>

            <p>
                রক্তদানের পরে অন্তত ২৪ ঘণ্টা ভারী কাজ এড়িয়ে চলুন।
            </p>

        </div>

    </div>

</body>

</html>
