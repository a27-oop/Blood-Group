<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Donor</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-red-100 min-h-screen">

    <nav class="bg-red-700 text-white p-4 flex justify-between">

        <h1 class="text-2xl font-bold">
            LifeLink AI
        </h1>

        <a href="/dashboard/" class="bg-white text-red-700 px-4 py-2 rounded-lg">
            Dashboard
        </a>

    </nav>

    <div class="max-w-6xl mx-auto p-10">

        <div class="bg-white p-8 rounded-2xl shadow-lg mb-10">

            <h2 class="text-3xl font-bold text-red-700 mb-6">
                Find Blood Donor
            </h2>

            <form method="GET" class="grid grid-cols-3 gap-4">

                <select name="blood_group"
                        class="p-3 border rounded-lg">

                    <option value="">Select Blood Group</option>

                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>

                </select>

                <input type="text"
                       name="district"
                       placeholder="Enter District"
                       class="p-3 border rounded-lg">

                <button class="bg-red-600 text-white rounded-lg hover:bg-red-700">
                    Find Donor
                </button>

            </form>

        </div>

        <div class="grid grid-cols-2 gap-6">

            {% for donor in donors %}

            <div class="bg-white p-6 rounded-2xl shadow-lg">

                <h3 class="text-2xl font-bold text-red-700 mb-3">
                    {{ donor.full_name }}
                </h3>

                <p class="mb-2">
                    <strong>Blood Group:</strong>
                    {{ donor.blood_group }}
                </p>

                <p class="mb-2">
                    <strong>University:</strong>
                    {{ donor.university }}
                </p>

                <p class="mb-2">
                    <strong>District:</strong>
                    {{ donor.district }}
                </p>

                <p class="mb-2">
                    <strong>Phone:</strong>
                    {{ donor.mobile }}
                </p>

                <p class="mb-2">
                    <strong>Unique Code:</strong>
                    {{ donor.unique_code }}
                </p>

            </div>

            {% endfor %}

        </div>

    </div>

</body>

</html>
