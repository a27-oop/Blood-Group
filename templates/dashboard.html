<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-red-100 min-h-screen">

    <nav class="bg-red-700 text-white p-4 flex justify-between">

        <h1 class="text-2xl font-bold">
            LifeLink AI
        </h1>

        <a href="/logout/"
           class="bg-white text-red-700 px-4 py-2 rounded-lg">
            Logout
        </a>

    </nav>

    <div class="p-10">

        <h2 class="text-3xl font-bold mb-8">
            Welcome, {{ user.full_name }}
        </h2>

        <!-- Dashboard Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">

            <!-- Total Donors -->
            <a href="/find-donor/">

                <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition text-center">

                    <h3 class="text-2xl font-bold text-red-700">
                        🩸 Donors
                    </h3>

                    <p class="text-gray-500 mt-2">
                        Registered Donors
                    </p>

                    <p class="text-5xl font-bold text-red-600 mt-5">
                        {{ total_donors }}
                    </p>

                </div>

            </a>

            <!-- Emergency Requests -->
            <a href="/emergency-request/">

                <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition text-center">

                    <h3 class="text-2xl font-bold text-red-700">
                        🚨 Emergency
                    </h3>

                    <p class="text-gray-500 mt-2">
                        Total Requests
                    </p>

                    <p class="text-5xl font-bold text-red-600 mt-5">
                        {{ total_requests }}
                    </p>

                </div>

            </a>

            <!-- Blood Groups -->
            <a href="/find-donor/">

                <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition text-center">

                    <h3 class="text-2xl font-bold text-red-700">
                        ❤️ Blood Groups
                    </h3>

                    <p class="text-gray-500 mt-2">
                        Available Groups
                    </p>

                    <p class="text-5xl font-bold text-red-600 mt-5">
                        {{ blood_groups }}
                    </p>

                </div>

            </a>

            <!-- AI -->
            <a href="/emergency-request/">

                <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition text-center">

                    <h3 class="text-2xl font-bold text-red-700">
                        🤖 AI Matches
                    </h3>

                    <p class="text-gray-500 mt-2">
                        Smart Recommendation
                    </p>

                    <p class="text-5xl font-bold text-red-600 mt-5">
                        Coming Soon
                    </p>

                </div>

            </a>

        </div>

    </div>

</body>

</html>
