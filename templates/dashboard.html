<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-red-100 min-h-screen">

    <nav class="bg-red-700 text-white p-4 flex justify-between">

        <h1 class="text-2xl font-bold">
            LifeLink AI
        </h1>

        <a href="/logout/" class="bg-white text-red-700 px-4 py-2 rounded-lg">
            Logout
        </a>

    </nav>

    <div class="p-10">

        <h2 class="text-3xl font-bold mb-8">
            Welcome, {{ user.full_name }}
        </h2>

        <div class="grid grid-cols-3 gap-6">

    <a href="/find-donor/">

        <div class="bg-white p-6 rounded-2xl shadow-lg hover:scale-105 transition cursor-pointer">

            <h3 class="text-2xl font-bold text-red-700 mb-3">
                Donor
            </h3>

            <p>
                Find blood donors quickly.
            </p>

        </div>

    </a>

    <div class="bg-white p-6 rounded-2xl shadow-lg">

        <h3 class="text-2xl font-bold text-red-700 mb-3">
            Donate
        </h3>

        <p>
            Donate blood and save lives.
        </p>

    </div>

    <div class="bg-white p-6 rounded-2xl shadow-lg">

        <h3 class="text-2xl font-bold text-red-700 mb-3">
            Health Tips
        </h3>

        <p>
            Stay healthy after donating blood.
        </p>

    </div>

</div>

    </div>

</body>
</html>
