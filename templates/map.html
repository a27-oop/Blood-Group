<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blood & Hospital Map - LifeLink AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        #map {
            height: 600px;
            width: 100%;
            border-radius: 20px;
        }

        .donor-icon {
            font-size: 30px;
            text-align: center;
        }

        .hospital-icon {
            font-size: 30px;
            text-align: center;
        }

    </style>

</head>


<body class="bg-red-50 min-h-screen">


    <!-- Navbar -->

    <nav class="bg-red-700 text-white p-4 flex justify-between items-center">

        <h1 class="text-2xl font-bold">
            🩸 LifeLink AI
        </h1>

        <a href="/dashboard/"
           class="bg-white text-red-700 px-5 py-2 rounded-lg font-semibold hover:bg-gray-100">

            Dashboard

        </a>

    </nav>


    <!-- Main -->

    <div class="max-w-7xl mx-auto p-8">


        <!-- Title -->

        <div class="mb-6">

            <h2 class="text-4xl font-bold text-red-700 mb-2">

                🗺️ Blood & Hospital Map

            </h2>

            <p class="text-gray-600">

                Find nearby blood donors and hospitals.

            </p>

        </div>


        <!-- Legend -->

        <div class="bg-white rounded-xl shadow p-4 mb-6 flex flex-wrap gap-6">

            <div class="flex items-center gap-2">

                <span class="text-2xl">
                    🩸
                </span>

                <span class="font-semibold text-gray-700">
                    Blood Donor
                </span>

            </div>


            <div class="flex items-center gap-2">

                <span class="text-2xl">
                    🏥
                </span>

                <span class="font-semibold text-gray-700">
                    Hospital
                </span>

            </div>

        </div>


        <!-- Map -->

        <div class="bg-white p-4 rounded-2xl shadow-lg">

            <div id="map"></div>

        </div>


    </div>


    <!-- Leaflet JavaScript -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- Donor Data -->

    {{ donors|json_script:"donor-data" }}


    <!-- Hospital Data -->

    {{ hospitals|json_script:"hospital-data" }}


    <script>


        // =====================================
        // CREATE MAP
        // =====================================

        var map = L.map('map').setView(
            [23.8103, 90.4125],
            12
        );


        // =====================================
        // OPEN STREET MAP
        // =====================================

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,

                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // =====================================
        // DONOR ICON
        // =====================================

        var donorIcon = L.divIcon({

            html: '🩸',

            className: 'donor-icon',

            iconSize: [35, 35],

            iconAnchor: [17, 17],

            popupAnchor: [0, -15]

        });


        // =====================================
        // HOSPITAL ICON
        // =====================================

        var hospitalIcon = L.divIcon({

            html: '🏥',

            className: 'hospital-icon',

            iconSize: [35, 35],

            iconAnchor: [17, 17],

            popupAnchor: [0, -15]

        });


        // =====================================
        // GET DONORS
        // =====================================

        var donors = JSON.parse(

            document
                .getElementById('donor-data')
                .textContent

        );


        console.log("Donors:", donors);


        // =====================================
        // ADD DONOR MARKERS
        // =====================================

        donors.forEach(function(donor) {


            var latitude =
                parseFloat(donor.latitude);


            var longitude =
                parseFloat(donor.longitude);


            if (
                isNaN(latitude) ||
                isNaN(longitude)
            ) {

                return;

            }


            var marker = L.marker(

                [latitude, longitude],

                {
                    icon: donorIcon
                }

            ).addTo(map);


            marker.bindPopup(

                `
                <div style="min-width:200px">

                    <h3 style="
                        font-size:20px;
                        font-weight:bold;
                        color:#dc2626;
                        margin-bottom:10px;
                    ">

                        🩸 Blood Donor

                    </h3>


                    <p>
                        <b>Name:</b>
                        ${donor.full_name}
                    </p>


                    <p>
                        <b>Blood Group:</b>
                        ${donor.blood_group}
                    </p>


                    <p>
                        <b>District:</b>
                        ${donor.district}
                    </p>


                </div>
                `

            );

        });


        // =====================================
        // GET HOSPITALS
        // =====================================

        var hospitals = JSON.parse(

            document
                .getElementById('hospital-data')
                .textContent

        );


        console.log("Hospitals:", hospitals);


        // =====================================
        // ADD HOSPITAL MARKERS
        // =====================================

        hospitals.forEach(function(hospital) {


            var latitude =
                parseFloat(hospital.latitude);


            var longitude =
                parseFloat(hospital.longitude);


            if (
                isNaN(latitude) ||
                isNaN(longitude)
            ) {

                return;

            }


            var marker = L.marker(

                [latitude, longitude],

                {
                    icon: hospitalIcon
                }

            ).addTo(map);


            marker.bindPopup(

                `
                <div style="min-width:220px">

                    <h3 style="
                        font-size:20px;
                        font-weight:bold;
                        color:#2563eb;
                        margin-bottom:10px;
                    ">

                        🏥 Hospital

                    </h3>


                    <p>
                        <b>Name:</b>
                        ${hospital.name}
                    </p>


                    <p>
                        <b>District:</b>
                        ${hospital.district}
                    </p>


                    <p>
                        <b>Address:</b>
                        ${hospital.address}
                    </p>


                    <p>
                        <b>Emergency:</b>

                        ${
                            hospital.emergency_service
                            ? "Available"
                            : "Not Available"
                        }

                    </p>


                    <p>
                        <b>Contact:</b>
                        ${hospital.contact_number}
                    </p>


                </div>
                `

            );

        });


    </script>


</body>

</html>
