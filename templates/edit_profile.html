<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - LifeLink AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-red-50 min-h-screen">


    <!-- Navbar -->

    <nav class="bg-red-700 text-white p-4 flex justify-between items-center">

        <h1 class="text-2xl font-bold">
            LifeLink AI
        </h1>

        <a href="/profile/"
           class="bg-white text-red-700 px-5 py-2 rounded-lg">

            My Profile

        </a>

    </nav>


    <!-- Main -->

    <div class="max-w-4xl mx-auto p-8">


        <div class="bg-white rounded-2xl shadow-lg p-8">


            <h2 class="text-3xl font-bold text-red-700 mb-2">

                ✏️ Edit Profile

            </h2>

            <p class="text-gray-500 mb-8">

                Update your personal information

            </p>


            <form method="POST">

                {% csrf_token %}


                <div class="grid md:grid-cols-2 gap-5">


                    <!-- Full Name -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            value="{{ user.full_name }}"
                            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500"
                            required
                        >

                    </div>


                    <!-- Mobile -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Mobile
                        </label>

                        <input
                            type="text"
                            name="mobile"
                            value="{{ user.mobile }}"
                            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            value="{{ user.email }}"
                            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500"
                            required
                        >

                    </div>


                    <!-- District -->

                    <div>

                        <label class="block font-semibold mb-2">
                            District
                        </label>

                        <input
                            type="text"
                            name="district"
                            value="{{ user.district }}"
                            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500"
                            required
                        >

                    </div>


                    <!-- Thana -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Thana
                        </label>

                        <input
                            type="text"
                            name="thana"
                            value="{{ user.thana }}"
                            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500"
                            required
                        >

                    </div>


                    <!-- Union -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Union
                        </label>

                        <input
                            type="text"
                            name="union"
                            value="{{ user.union }}"
                            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500"
                            required
                        >

                    </div>


                    <!-- Village -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Village
                        </label>

                        <input
                            type="text"
                            name="village"
                            value="{{ user.village }}"
                            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500"
                            required
                        >

                    </div>

                </div>

                    <!-- Latitude -->

                <div>

                    <label class="block font-semibold mb-2">
                        Latitude
                    </label>

                    <input
                        type="number"
                        step="any"
                        name="latitude"
                        value="{{ user.latitude|default:'' }}"
                        placeholder="Example: 23.8103"
                        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500"
                    >

                </div>


                <!-- Longitude -->

                <div>

                    <label class="block font-semibold mb-2">
                        Longitude
                    </label>

                    <input
                        type="number"
                        step="any"
                        name="longitude"
                        value="{{ user.longitude|default:'' }}"
                        placeholder="Example: 90.4125"
                        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-500"
                    >

                </div>


                <!-- Buttons -->

                <div class="flex gap-4 mt-8">

                    <button
                        type="submit"
                        class="bg-red-600 text-white px-7 py-3 rounded-xl hover:bg-red-700 font-semibold">

                        💾 Save Changes

                    </button>


                    <a
                        href="/profile/"
                        class="bg-gray-200 text-gray-700 px-7 py-3 rounded-xl hover:bg-gray-300 font-semibold">

                        Cancel

                    </a>

                </div>


            </form>


        </div>

    </div>


</body>

</html>
