{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LifeLink AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;

            background-color: #7f1d1d;

            background-image: url("{% static 'images/blood-bg.jpg' %}") !important;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }

    </style>

</head>


<body class="min-h-screen flex items-center justify-center">


    <!-- ============================= -->
    <!-- TOP LEFT LOGO -->
    <!-- ============================= -->

    <div class="fixed top-6 left-6 flex items-center gap-3 z-50">

        <div class="text-5xl">
            🩸
        </div>

        <h1 class="text-white text-3xl font-extrabold tracking-wide">
            LifeLink AI
        </h1>

    </div>


    <!-- ============================= -->
    <!-- LOGIN CARD -->
    <!-- ============================= -->

    <div class="bg-white/10 backdrop-blur-lg p-10 rounded-3xl shadow-2xl w-[450px] border border-white/20">


        <!-- Heading -->

        <h2 class="text-3xl font-bold text-white text-center mb-4">

            Welcome

        </h2>


        <p class="text-center text-white mb-8 text-xl">

            আপনার রক্ত দানই পারে কারো জীবন বাঁচাতে ❤️

        </p>


        <!-- ============================= -->
        <!-- LOGIN FORM -->
        <!-- ============================= -->

        <form method="POST">

            {% csrf_token %}


            <!-- Student ID -->

            <input
                type="text"
                name="student_id"
                placeholder="Student ID"
                class="w-full p-4 mb-5 rounded-xl bg-white/90 outline-none"
                required
            >


            <!-- Password -->

            <input
                type="password"
                name="password"
                placeholder="Password"
                class="w-full p-4 mb-6 rounded-xl bg-white/90 outline-none"
                required
            >


            <!-- Login Button -->

            <button
                type="submit"
                class="w-full bg-red-700 hover:bg-red-800 text-white p-4 rounded-xl text-lg font-bold transition"
            >

                Login

            </button>

        </form>


        <!-- ============================= -->
        <!-- CREATE ACCOUNT -->
        <!-- ============================= -->

        <p class="text-center text-white mt-6">

            Don't have an account?

            <a
                href="/register/"
                class="font-bold text-red-300 hover:text-red-200"
            >

                Create Account

            </a>

        </p>


    </div>


</body>

</html>
