<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-red-100 flex justify-center items-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">

        <h1 class="text-3xl font-bold text-center text-red-700 mb-6">
            Login
        </h1>

        <form>

            <input type="text"
                   placeholder="Student ID"
                   class="w-full p-3 mb-4 border rounded-lg">

            <input type="password"
                   placeholder="Password"
                   class="w-full p-3 mb-4 border rounded-lg">

            <button class="w-full bg-red-600 text-white p-3 rounded-lg hover:bg-red-700">
                Login
            </button>

        </form>

        <p class="text-center mt-4">
            Don't have an account yet?

            <a href="/register/" class="text-red-600 font-bold">
                Create Account
            </a>
        </p>

    </div>

</body>
</html>
