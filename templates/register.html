<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink AI Register</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-red-100 flex justify-center items-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">

        <h1 class="text-3xl font-bold text-center text-red-700 mb-6">
            LifeLink AI
        </h1>

        <h2 class="text-xl text-center mb-4">
            Create Account
        </h2>

        <form>

            <input type="text"
                   placeholder="Full Name"
                   class="w-full p-3 mb-4 border rounded-lg">

            <input type="text"
                   placeholder="Mobile Number"
                   class="w-full p-3 mb-4 border rounded-lg">

            <input type="email"
                   placeholder="Gmail"
                   class="w-full p-3 mb-4 border rounded-lg">

            <button class="w-full bg-red-600 text-white p-3 rounded-lg hover:bg-red-700">
                Next
            </button>

        </form>

        <p class="text-center mt-4">
            Already have an account?

            <a href="/login/" class="text-red-600 font-bold">
                Login
            </a>
        </p>

    </div>

</body>
</html>
