{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifeLink AI Register</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<style>
    body {
        background-image: url("{% static 'images/blood-bg.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }
</style>

<body class="min-h-screen flex justify-center items-center py-10">
    

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-[500px]">

        <h1 class="text-3xl font-bold text-center text-red-700 mb-2">
            LifeLink AI
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Emergency Blood & Medicine Finder
        </p>

        <form method="POST" class="grid grid-cols-2 gap-4">

    {% csrf_token %}

    <input type="text"
           name="full_name"
           placeholder="Full Name"
           class="col-span-2 p-3 border rounded-lg"
           required>

    <input type="text"
           name="mobile"
           placeholder="Mobile Number"
           class="p-3 border rounded-lg"
           required>

    <input type="email"
           name="email"
           placeholder="Gmail"
           class="p-3 border rounded-lg"
           required>

    <select name="blood_group"
            class="p-3 border rounded-lg"
            required>

        <option value="">Blood Group</option>

        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>AB+</option>
        <option>AB-</option>
        <option>O+</option>
        <option>O-</option>

    </select>

    <input type="text"
           name="student_id"
           placeholder="Student ID"
           class="p-3 border rounded-lg"
           required>

    <input type="text"
           name="university"
           placeholder="University"
           class="col-span-2 p-3 border rounded-lg"
           required>

    <input type="text"
           name="district"
           placeholder="District"
           class="p-3 border rounded-lg"
           required>

    <input type="text"
           name="thana"
           placeholder="Thana"
           class="p-3 border rounded-lg"
           required>

    <input type="text"
           name="union"
           placeholder="Union"
           class="p-3 border rounded-lg"
           required>

    <input type="text"
           name="village"
           placeholder="Village/City"
           class="p-3 border rounded-lg"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           class="col-span-2 p-3 border rounded-lg"
           required>

    <button class="col-span-2 bg-red-600 text-white p-3 rounded-lg hover:bg-red-700 transition">
        Create Account
    </button>

</form>

        <p class="text-center mt-5">
            Already have an account?

            <a href="/login/" class="text-red-600 font-bold">
                Login
            </a>
        </p>

    </div>

</body>
{% if messages %}

<div class="absolute top-5">

    {% for message in messages %}

        <div class="bg-red-500 text-white px-6 py-3 rounded-lg mb-2 shadow-lg">

            {{ message }}

        </div>

    {% endfor %}

</div>

{% endif %}

</html>
